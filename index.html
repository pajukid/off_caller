<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f3864">
<title>CAPRA 콜 파인더 v6</title>
<style>
  :root{--ink:#14181d; --paper:#f7f6f2; --line:#d8d5cc; --navy:#1f3864; --half2:#14532d; --accent:var(--navy);
    --b-레드:#c0392b; --b-블루:#1f5fbf; --b-골드:#b8860b; --b-퍼플:#7b3fb5; --b-그린:#2e7d32; --b-블랙:#222222;
    --t-기본:#d9ead3; --t-PA:#cfe2f3; --t-젯:#e4d7f5; --t-젯리드:#fce5cd; --t-아이폼:#fff2cc;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--paper);color:var(--ink);max-width:720px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  body.h2{--accent:var(--half2)}
  body.typing header, body.typing .hint, body.typing footer{display:none}
  header{background:var(--accent);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;transition:background .2s}
  header h1{font-size:16px;font-weight:800;flex:1;line-height:1.2}
  header h1 small{display:block;font-size:11px;font-weight:500;opacity:.75}
  .half-toggle{display:flex;border:2px solid rgba(255,255,255,.55);border-radius:12px;overflow:hidden}
  .half-toggle button{font:inherit;font-weight:800;font-size:17px;padding:9px 18px;background:transparent;color:rgba(255,255,255,.65);border:0;cursor:pointer}
  .half-toggle button.on{background:#fff;color:var(--accent)}
  .search-wrap{padding:14px 14px 0;position:sticky;top:0;background:var(--paper);z-index:5}
  .search-box{position:relative}
  #q{width:100%;font:inherit;font-size:24px;font-weight:700;padding:16px 52px 16px 18px;border:3px solid var(--ink);border-radius:16px;background:#fff;outline:none}
  #q:focus{border-color:var(--accent)}
  #clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:var(--line);font-size:20px;font-weight:800;cursor:pointer;display:none}
  .hint{font-size:12px;color:#6b6a63;padding:8px 6px 0}
  main{flex:1;padding:0 14px 30px}
  #sugg{list-style:none;padding:10px 0 4px}
  #sugg li{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
  #sugg .name{font-size:21px;font-weight:800}
  #sugg .name mark{background:#ffe58a;border-radius:3px;padding:0 1px}
  #sugg .tag{margin-left:auto;font-size:12px;font-weight:700;color:#6b6a63}
  .empty{padding:26px 10px;text-align:center;color:#8a887f;font-size:15px}
  #detail{display:none}
  .play-head{display:flex;align-items:baseline;gap:12px;margin:14px 2px 10px;flex-wrap:wrap}
  .play-head h2{font-size:30px;font-weight:900;letter-spacing:-.03em}
  .grp{margin-bottom:12px}
  .grp h3{font-size:13px;font-weight:800;color:#6b6a63;margin:0 2px 6px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opts button{font:inherit;font-weight:800;font-size:17px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .opts button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .opts button:disabled{opacity:.3;cursor:default}
  .result{margin-top:14px;background:#fff;border:2px solid var(--accent);border-radius:16px;padding:14px 16px}
  .result .lbl{font-size:14px;font-weight:700;color:#6b6a63;margin-bottom:8px}
  .result .lbl b{color:var(--ink);font-size:16px}
  .codes{display:flex;flex-wrap:wrap;gap:10px}
  .code{border-radius:14px;padding:12px 18px;font-size:30px;font-weight:900;color:#fff;letter-spacing:.02em;line-height:1.1}
  .code small{display:block;font-size:12px;font-weight:700;opacity:.85;letter-spacing:0}
  .none{color:#8a887f;font-size:15px;padding:6px 2px}
  .back{font:inherit;font-weight:800;font-size:14px;margin:14px 0 0;padding:8px 16px;border-radius:10px;border:2px solid var(--ink);background:#fff;cursor:pointer}
  .rev{list-style:none;padding:10px 0}
  .rev li{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
  .rev .cd{font-size:22px;font-weight:900;color:#fff;border-radius:10px;padding:6px 12px;min-width:110px;text-align:center}
  .rev .pl{font-size:19px;font-weight:800}
  .rev .fm{margin-left:auto;font-size:12px;color:#6b6a63;font-weight:700}
  footer{padding:10px 16px 18px;font-size:12px;color:#8a887f;text-align:center}
</style>
</head>
<body>
<header>
  <h1>CAPRA 콜 파인더 v6<small>콜 = 밴드 + 두 자리 · 0x 아이폼 / 1~3x 더블 / 4~5x 타이트 / 7~9x 트립스</small></h1>
  <div class="half-toggle"><button id="btn1" class="on" onclick="setHalf(1)">전반</button><button id="btn2" onclick="setHalf(2)">후반</button></div>
</header>
<div class="search-wrap">
  <div class="search-box"><input id="q" type="text" inputmode="search" autocomplete="off" placeholder="작전 검색 (예: 크러, ㄷㅇ) 또는 코드 (예: 34)"><button id="clear" onclick="clearQ()">✕</button></div>
  <div class="hint">작전 → 포메이션·태그·방향 고르면 콜이 뜸 · 두 자리 숫자 치면 코드 역검색</div>
</div>
<main>
  <ul id="sugg"></ul>
  <section id="detail"></section>
</main>
<footer>더미 하나 + 진짜 하나 · 1·3Q 첫 그룹 / 2·4Q 둘째 그룹 · "킬킬" = 취소 후 재콜 · 맨 끝 방향 = 공 가는 쪽</footer>

  const hit=all.find(c=>c.fam===sel.fam&&c.tag===sel.tag&&c.dir===sel.dir) || (sel.fam==="아이폼"?all[0]:null);
  if(hit){
    const txt=[hit.tag==="기본"?"":hit.tag, hit.play, hit.dir==="없음"?"":hit.dir].filter(Boolean).join(" ");
    html+=`<div class="result"><div class="lbl">${H()} · ${hit.fam} · <b>${txt}</b></div><div class="codes">`+
      hit.codes.map(x=>{const [b,n]=x.split(" ");return `<div class="code" style="background:${bandColor(b)}">${b} ${n}<small>${[...n].map(ch=>ch==="0"?"공":ch).join(" ")}</small></div>`;}).join("")+
      `</div></div>`;
  } else if(sel.fam&&sel.tag&&sel.dir){
    html+=`<div class="result"><div class="none">이 조합은 없음</div></div>`;
  }
  html+=`<button class="back" onclick="home()">‹ 처음으로</button>`;
  $("detail").innerHTML=html; $("detail").style.display="block";
}
function home(){ sel=null; $("detail").style.display="none"; $("q").value=""; $("clear").style.display="none"; $("sugg").innerHTML=""; }
$("q").addEventListener("input",onInput);
$("q").addEventListener("focus",()=>document.body.classList.add("typing"));
$("q").addEventListener("blur",()=>setTimeout(()=>document.body.classList.remove("typing"),250));
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
</script>
</body>
